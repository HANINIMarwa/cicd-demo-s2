name: ajout image docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t cicd-demo-s2:ci .
      - name: Connexion à GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publier l'image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag cicd-demo-s2:ci $IMAGE:latest
          docker tag cicd-demo-s2:ci $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::7}
